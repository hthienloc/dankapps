<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5EFF7"/>
      <stop offset="100%" stop-color="#D0BCFF"/>
    </linearGradient>

    <linearGradient id="photoSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#381E72"/>
      <stop offset="60%" stop-color="#4F378B"/>
      <stop offset="100%" stop-color="#7F67BE"/>
    </linearGradient>

    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD8E4"/>
      <stop offset="100%" stop-color="#FFB787"/>
    </linearGradient>

    <linearGradient id="frontPeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EADDFF"/>
      <stop offset="100%" stop-color="#D0BCFF"/>
    </linearGradient>

    <clipPath id="innerPhotoClip">
      <rect x="11" y="11" width="42" height="42" rx="9"/>
    </clipPath>
  </defs>

  <!-- Outer Squircle Card (Dank App Signature) -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#body)"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="13.5" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

  <!-- Inner Framed Photo Window -->
  <rect x="11" y="11" width="42" height="42" rx="9" fill="url(#photoSky)"/>

  <g clip-path="url(#innerPhotoClip)">
    <!-- Radiant Sun / Lens Glow -->
    <circle cx="39" cy="22" r="7" fill="url(#sun)" opacity="0.35"/>
    <circle cx="39" cy="22" r="4.5" fill="url(#sun)"/>

    <!-- Back Mountain Range -->
    <path d="M22 47 L30 30 C31.2 27.5 34.8 27.5 36 30 L48 47 Z" fill="#9A82DB" opacity="0.75"/>

    <!-- Front Mountain Peak -->
    <path d="M8 47 L19 33 C20.5 31 23.5 31 25 33 L38 47 Z" fill="url(#frontPeak)"/>
    <path d="M28 47 L38 36 C39.5 34.5 42 34.5 43.5 36 L52 47 Z" fill="#B69DF8" opacity="0.9"/>
    <rect x="11" y="45" width="42" height="9" fill="url(#frontPeak)"/>
  </g>

  <!-- Camera / Shutter Lens Ring Notch at Top Right -->
  <circle cx="48" cy="14" r="2" fill="#6750A4" opacity="0.3"/>
</svg>
