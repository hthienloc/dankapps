<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5EFF7"/>
      <stop offset="100%" stop-color="#D0BCFF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#381E72"/>
      <stop offset="60%" stop-color="#4F378B"/>
      <stop offset="100%" stop-color="#7F67BE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD8E4"/>
      <stop offset="100%" stop-color="#FFB787"/>
    </linearGradient>
    <linearGradient id="light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EADDFF"/>
      <stop offset="100%" stop-color="#D0BCFF"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="11" y="11" width="42" height="42" rx="9"/>
    </clipPath>
  </defs>

  <!-- Outer Squircle Card (Dank App Signature) -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#body)"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="13.5" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

  <rect x="11" y="11" width="42" height="42" rx="9" fill="url(#panel)"/>
  <!-- Sliding tile puzzle -->
    <rect x="15.0" y="15.0" width="10" height="10" rx="2.2" fill="url(#light)"/>
    <rect x="27.1" y="15.0" width="10" height="10" rx="2.2" fill="url(#light)"/>
    <rect x="39.2" y="15.0" width="10" height="10" rx="2.2" fill="url(#light)"/>
    <rect x="15.0" y="27.1" width="10" height="10" rx="2.2" fill="url(#light)"/>
    <rect x="27.1" y="27.1" width="10" height="10" rx="2.2" fill="url(#accent)"/>
    <rect x="39.2" y="27.1" width="10" height="10" rx="2.2" fill="#B69DF8" opacity="0.55"/>
    <rect x="15.0" y="39.2" width="10" height="10" rx="2.2" fill="url(#light)"/>
    <rect x="27.1" y="39.2" width="10" height="10" rx="2.2" fill="#B69DF8" opacity="0.55"/>
    <rect x="39.2" y="39.2" width="10" height="10" rx="2.2" fill="none" stroke="#B69DF8" stroke-width="1" stroke-dasharray="2 1.6" opacity="0.7"/>
</svg>
